<svg xmlns="http://www.w3.org/2000/svg" width="700" height="278" viewBox="0 0 700 278" role="img" aria-label="GitHub overview">
<title>GitHub overview</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a30"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/><stop offset=".6" stop-color="#6366f1" stop-opacity=".12"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Ubuntu,'Helvetica Neue',Arial,sans-serif}
.t{fill:#e2e8f0;font-size:17px;font-weight:600}
.m{fill:#94a3b8;font-size:12px}
.u{fill:#94a3b8;font-size:11px;font-weight:600;letter-spacing:.08em}
.s{fill:#64748b;font-size:11px}
.v{fill:#f8fafc;font-size:28px;font-weight:700}
.l{fill:#cbd5e1;font-size:13px;font-weight:600}
.fade{animation:fade .7s cubic-bezier(.22,1,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.appear{animation:appear 1.2s ease-out both}
@keyframes appear{from{opacity:0}to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:0;transform:scale(2.2)}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect x=".5" y=".5" width="699" height="277" rx="14" fill="url(#bg)" stroke="#1e293b"/>
<g class="fade"><text x="35" y="38" class="t">GitHub Overview</text><text x="665" y="38" text-anchor="end" class="m">@Junaed10  ·  11 repositories</text></g><rect class="grow" x="35" y="48" width="56" height="3" rx="1.5" fill="url(#accent)"/><g transform="translate(35 70)"><g class="fade" style="animation-delay:0.15s"><rect width="200" height="82" rx="11" fill="#0e1a2f" stroke="#1e293b"/><rect x="0" y="16" width="3.5" height="50" rx="1.75" fill="#22d3ee"/><text x="20" y="27" class="u">CONTRIBUTIONS</text><text x="20" y="57" class="v">29</text><text x="20" y="73" class="s">last 12 months</text></g></g><g transform="translate(250 70)"><g class="fade" style="animation-delay:0.24s"><rect width="200" height="82" rx="11" fill="#0e1a2f" stroke="#1e293b"/><rect x="0" y="16" width="3.5" height="50" rx="1.75" fill="#38bdf8"/><text x="20" y="27" class="u">COMMITS</text><text x="20" y="57" class="v">25</text><text x="20" y="73" class="s">last 12 months</text></g></g><g transform="translate(465 70)"><g class="fade" style="animation-delay:0.33s"><rect width="200" height="82" rx="11" fill="#0e1a2f" stroke="#1e293b"/><rect x="0" y="16" width="3.5" height="50" rx="1.75" fill="#6366f1"/><text x="20" y="27" class="u">PULL REQUESTS</text><text x="20" y="57" class="v">0</text><text x="20" y="73" class="s">all time</text></g></g><g transform="translate(35 166)"><g class="fade" style="animation-delay:0.42s"><rect width="200" height="82" rx="11" fill="#0e1a2f" stroke="#1e293b"/><rect x="0" y="16" width="3.5" height="50" rx="1.75" fill="#8b5cf6"/><text x="20" y="27" class="u">ISSUES</text><text x="20" y="57" class="v">0</text><text x="20" y="73" class="s">all time</text></g></g><g transform="translate(250 166)"><g class="fade" style="animation-delay:0.51s"><rect width="200" height="82" rx="11" fill="#0e1a2f" stroke="#1e293b"/><rect x="0" y="16" width="3.5" height="50" rx="1.75" fill="#2dd4bf"/><text x="20" y="27" class="u">STARS EARNED</text><text x="20" y="57" class="v">0</text><text x="20" y="73" class="s">across repositories</text></g></g><g transform="translate(465 166)"><g class="fade" style="animation-delay:0.60s"><rect width="200" height="82" rx="11" fill="#0e1a2f" stroke="#1e293b"/><rect x="0" y="16" width="3.5" height="50" rx="1.75" fill="#a78bfa"/><text x="20" y="27" class="u">FOLLOWERS</text><text x="20" y="57" class="v">1</text><text x="20" y="73" class="s">on GitHub</text></g></g>
</svg>
