<svg xmlns="http://www.w3.org/2000/svg" width="700" height="192" viewBox="0 0 700 192" role="img" aria-label="Contribution streak">
<title>Contribution streak</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a30"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/><stop offset=".6" stop-color="#6366f1" stop-opacity=".12"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Ubuntu,'Helvetica Neue',Arial,sans-serif}
.t{fill:#e2e8f0;font-size:17px;font-weight:600}
.m{fill:#94a3b8;font-size:12px}
.u{fill:#94a3b8;font-size:11px;font-weight:600;letter-spacing:.08em}
.s{fill:#64748b;font-size:11px}
.v{fill:#f8fafc;font-size:28px;font-weight:700}
.l{fill:#cbd5e1;font-size:13px;font-weight:600}
.fade{animation:fade .7s cubic-bezier(.22,1,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.3s cubic-bezier(.22,1,.36,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.draw{animation:draw 2.4s cubic-bezier(.4,0,.2,1) both}
.appear{animation:appear 1.2s ease-out both}
@keyframes appear{from{opacity:0}to{opacity:1}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:0;transform:scale(2.2)}}
.glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes ring{from{stroke-dasharray:0 276.5}to{stroke-dasharray:0.0 276.5}}</style></defs>
<rect x=".5" y=".5" width="699" height="191" rx="14" fill="url(#bg)" stroke="#1e293b"/>
<line x1="233.5" y1="34" x2="233.5" y2="158" stroke="#1e293b"/><line x1="466.5" y1="34" x2="466.5" y2="158" stroke="#1e293b"/><g class="fade"><text x="117" y="98" text-anchor="middle" font-size="36" font-weight="700" fill="url(#accent)" >66</text><text x="117" y="140" text-anchor="middle" class="l">Total contributions</text><text x="117" y="160" text-anchor="middle" class="s">Nov 9 – Nov 13</text></g><g class="fade" style="animation-delay:.15s"><circle cx="350" cy="76" r="44" fill="none" stroke="#1e293b" stroke-width="7"/><circle class="glow" cx="350" cy="76" r="44" fill="none" stroke="url(#accentV)" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.0 276.5" transform="rotate(-90 350 76)" style="animation:ring 1.8s cubic-bezier(.4,0,.2,1) .4s both,glow 3s ease-in-out 2.2s infinite"/><g transform="translate(340.4 40) scale(.8)" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></g><text x="350" y="90" text-anchor="middle" font-size="30" font-weight="700" fill="#f8fafc">0</text><text x="350" y="140" text-anchor="middle" class="l">Current streak</text><text x="350" y="160" text-anchor="middle" class="s">—</text></g><g class="fade" style="animation-delay:.3s"><text x="583" y="98" text-anchor="middle" font-size="36" font-weight="700" fill="url(#accent)" >2</text><text x="583" y="140" text-anchor="middle" class="l">Longest streak</text><text x="583" y="160" text-anchor="middle" class="s">Nov 22 – Nov 23</text></g>
</svg>
